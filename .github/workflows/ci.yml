name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Mirrors docker-compose.yml's local dev Postgres. Needed for the
      # DB-backed tests introduced by the authentication feature (RLS
      # isolation tests, apps/api integration tests).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avatrain
          POSTGRES_PASSWORD: avatrain
          POSTGRES_DB: avatrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avatrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations run as the superuser/owner (DATABASE_URL). Runtime
      # queries — including tests, since they exercise the same code path
      # as apps/api — connect as the unprivileged avatrain_app role
      # (APP_DATABASE_URL) so RLS is actually enforced. Both roles are
      # provisioned by prisma/migrations/*_app_role_rls. See
      # packages/shared/src/db/client.ts and .claude/rules/tenancy.md.
      DATABASE_URL: postgresql://avatrain:avatrain@localhost:5432/avatrain
      APP_DATABASE_URL: postgresql://avatrain_app:avatrain_app@localhost:5432/avatrain
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm verify
