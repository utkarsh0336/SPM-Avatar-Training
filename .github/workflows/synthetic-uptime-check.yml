name: Synthetic Uptime Check

# Runs from GitHub's infra, deliberately outside Avatrain's own — a check
# that only ran from inside our infra couldn't detect a full-region (or
# full-platform) outage. See scripts/report-uptime-check.mjs for exactly
# what's checked (apps/api's two regions; apps/agent isn't externally
# reachable — see that script's header comment) and how results reach
# POST /v1/internal/uptime-checks.
on:
  # Schedule intentionally disabled: apps/api has never been `fly deploy`'d to
  # a real Fly org yet (avatrain-api-us/eu.fly.dev don't resolve), so every
  # 5-minute run was failing on DNS resolution, not a real outage. Re-enable
  # the cron trigger once apps/api is actually deployed to those two Fly
  # apps — see [[auto_scaling_status]]/[[reliability_uptime_dr_status]] specs'
  # open "fly deploy against a real Fly org" checkbox. Until then, run
  # manually via workflow_dispatch if you want to sanity-check the script.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report uptime checks
        env:
          INTERNAL_OPS_TOKEN: ${{ secrets.INTERNAL_OPS_TOKEN }}
        run: node scripts/report-uptime-check.mjs
