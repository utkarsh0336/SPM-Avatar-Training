# apps/agent — US region worker pool. No [http_service]: these machines
# don't serve inbound HTTP — they register with LiveKit (config.LIVEKIT_URL)
# and receive job dispatch, per docs/ARCHITECTURE.md §4's worker lifecycle.
# Scaling is handled externally by fly-autoscaler (infra/fly/autoscaler-agent-us.yml),
# not by anything in this file — see infra/README.md for why apps/agent
# can't use Fly's native request-concurrency autoscaling apps/api uses.
#
# Deploy: fly deploy . --config infra/fly/agent-us.toml --dockerfile apps/agent/Dockerfile --region iad
# Baseline machine count (fly-autoscaler adjusts from here):
#   fly scale count 2 --region iad -a avatrain-agent-us
#
# Needs DATABASE_URL/APP_DATABASE_URL secrets too, even though this app
# never queries Postgres itself — see infra/README.md's "Local validation"
# section for why (a transitive @avatrain/shared import). Without them the
# process crashes on boot. `fly mpg attach <cluster-id> -a avatrain-agent-us`
# (same US Postgres cluster avatrain-api-us uses).

app = "avatrain-agent-us"
primary_region = "iad"

[env]
  DATA_REGION = "US"
  METRICS_PORT = "9091"

# Scraped by Fly's built-in Prometheus collector every ~15s, queryable at
# https://api.fly.io/prometheus/<org> — what fly-autoscaler's prometheus
# metric-collector reads. See apps/agent/src/metrics-server.ts.
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
